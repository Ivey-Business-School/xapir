title: xapir
url: https://Ivey-Business-School.github.io/xapir/
template:
  bootstrap: 5
  opengraph:
    image:
      src: man/figures/xapir.png
      alt: "xapir package logo"
  params:
    bootswatch: spacelab

home:
  strip_header: true

navbar:
  type: default
  left:
    - text: Get started
      icon: fa-play-circle
      href: articles/getting-started.html
    - text: Reference
      icon: fa-file-code-o
      href: reference/index.html
    - text: News
      icon: fa-newspaper-o
      href: news/index.html
  right:
    - text: GitHub
      icon: fa-github fa-lg
      href: https://github.com/Ivey-Business-School/xapir

articles:
  - title: Guides
    contents:
      - getting-started

reference:
  - title: Reading posts
    desc: One request to the X API, saved whole as a frozen file you unfold later.
    contents:
      - get_timeline
      - get_recent_post
      - get_recent_post_count
      - get_post
      - get_quote_post
      - get_repost
      - get_mentions
      - get_account_timeline
      - get_bookmark
      - get_liked_posts
      - get_liking_users
      - get_repost_of_me
      - iso_8601
  - title: Unfolding a pull into tables
    desc: The twelve tables of the course's data model, each from a saved pull. None of these calls the API.
    contents:
      - extract_post
      - extract_user
      - extract_post_media
      - extract_post_url
      - extract_post_mention
      - extract_post_hashtag
      - extract_post_cashtag
      - extract_post_context
      - extract_post_entity_annotation
      - extract_post_poll_option
      - extract_post_place
      - extract_post_edited_post_id
  - title: Accounts and follows
    desc: Profiles by handle, id or search, and who follows, is followed by, reposts, blocks or mutes. Each returns the 24 user columns of `extract_user()`.
    contents:
      - get_users_by_usernames
      - get_users_by_ids
      - search_users
      - get_followers
      - get_following
      - get_reposted_by
      - get_blocking
      - get_muting
  - title: Lists
    desc: Lists an account owns, follows, pinned or was added to, and a list's members, followers and posts.
    contents:
      - get_owned_list
      - get_followed_lists
      - get_list_by_id
      - get_list_member
      - get_list_followers
      - get_list_memberships
      - get_list_posts
      - get_pinned_lists
  - title: Search the archive
    desc: Every public post back to 2006. Needs pay-per-use or Enterprise access.
    contents:
      - get_all_post
      - get_all_post_count
  - title: Spaces, communities and news
    desc: Audio spaces, communities, the news stories X builds from posts, and trending topics by place.
    contents:
      - get_spaces
      - search_spaces
      - get_space_posts
      - get_community
      - search_communities
      - search_news
      - get_news
      - get_trends_by_woeid
  - title: Your own account
    desc: What your project has read and spent, how your posts performed, your trends and your profile. All need a sign-in except usage.
    contents:
      - get_my_user
      - get_usage
      - get_usage_credits
      - get_post_analytics
      - get_personalized_trends
  - title: Writing to X
    desc: These act on your own account and need a user token. Each prints its price before the request.
  - subtitle: Posts and media
    contents:
      - create_post
      - upload_media
      - delete_post
      - create_repost
      - delete_repost
  - subtitle: Interactions
    contents:
      - like_post
      - unlike_post
      - follow_user
      - unfollow_user
  - subtitle: Lists
    contents:
      - create_list
      - update_list
      - delete_list
      - add_list_member
      - remove_list_member
      - follow_list
      - unfollow_list
      - pin_list
      - unpin_list
  - subtitle: Bookmarks
    contents:
      - create_bookmark
      - delete_bookmark
  - subtitle: Moderation
    contents:
      - hide_reply
      - mute_user
      - unmute_user
      - block_user
      - unblock_user
